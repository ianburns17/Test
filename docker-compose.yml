services:
  postgres:
    image: postgres:16-alpine
    container_name: image-api-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: image_db
    volumes:
      - image_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d image_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  image_postgres_data:
